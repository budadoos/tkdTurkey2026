<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taekwondo Turkey Board Break</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="dojaing-bg">
            <div id="floor"></div>
        </div>

        <!-- Turkey PNG Image Container -->
        <div id="turkey-container">
            <img src="turkey.png" alt="Taekwondo Turkey" id="turkey-img">
        </div>

        <!-- The Wooden Board -->
         <div id="board-holder">
            <div class="board-half board-top"></div>
            <div class="board-half board-bottom"></div>
         </div>

         <!-- Battle Cry Text -->
         <div id="kiap-text">KIAP!!</div>
         
        <!-- UI & HUD Layer -->
         <div id="ui-layer">
            <div id="hud-header">
                <div class="hud-text" id="score-display">Score: 0</div>
                <div id="level-display">Rank: White Belt</div>
            </div>
         </div>
         <div id="power-bar-container">
            <div id="power-marker"></div>
            <div id="power-bar"></div>
         </div>
         <!-- Inside #ui-layer, below the #instructions div -->
        <div id="congrats-screen" style="display: none;">
            <h1>🎉 CONGRATULATIONS! 🎉</h1>
            <p>You have mastered the dojang and achieved the ultimate rank of <b>Grandmaster Turkey</b>!</p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>

         <div id="instructions">
            <h2>Taekwondo Turkey Board Break</h2>
            <p>Hold <b>SPACEBAR</b>(for PC) or tap and hold(for mobile) to build power.<br>Release when the gauge crosses the line to break the board!</p>
            <button id="start-btn">START</button>
         </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
